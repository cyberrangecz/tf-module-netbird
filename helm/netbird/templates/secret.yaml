apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.server.name }}-config
  labels: {{- include "common.labels" (dict "name" .Values.server.name "chart" .Chart "release" .Release "extraLabels" .Values.extraLabels) | nindent 4 }}
stringData:
  config.yaml: |
    server:
      listenAddress: ":{{ .Values.server.port }}"
      exposedAddress: "https://netbird.{{ .Values.headHost }}:443"
      stunPorts:
        - {{ .Values.server.stunPort }}
      metricsPort: 9090
      healthcheckAddress: ":9000"
      logLevel: "info"
      logFile: "console"
      authSecret: "{{ .Values.server.relayAuthSecret }}"
      dataDir: {{ .Values.server.dataDir }}

      auth:
        issuer: "https://netbird.{{ .Values.headHost }}/oauth2"
        signKeyRefreshEnabled: true
        dashboardRedirectURIs:
          - "https://netbird.{{ .Values.headHost }}/nb-auth"
          - "https://netbird.{{ .Values.headHost }}/nb-silent-auth"
        cliRedirectURIs:
          - "http://localhost:53000/"

      reverseProxy:
        trustedHTTPProxies:
          - "0.0.0.0/0"

      store:
        engine: "sqlite"
        encryptionKey: {{ .Values.encryptionKey }}
